header { background: #fff; padding: 14px 24px; border-bottom: 1px solid #e0e0e5; position: sticky; top: 0; z-index: 10; }

.toolbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar > div { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button { padding: 6px 12px; border-radius: 6px; border: 1px solid #d0d0d5; background: #fff; cursor: pointer; font-size: 13px; font-family: inherit; }
button:hover { background: #f0f0f5; }
.btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.month-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.month-tab { padding: 5px 12px; border: 1px solid #d0d0d5; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
.month-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.container { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px 24px; align-items: start; }
.event-list { background: #fff; border-radius: 10px; padding: 10px; max-height: calc(100vh - 180px); overflow-y: auto; position: sticky; top: 160px; }
.event-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; font-size: 13px; line-height: 1.4; }
.event-item:hover { background: #f5f5f8; }
.event-item.active { background: #e8f0ff; border-color: #3070e0; }
.event-item.summary-item { background: #f7f7fa; border-color: #e0e0e5; font-weight: 600; margin-bottom: 8px; }
.event-item.summary-item.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.event-date { font-weight: 600; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.3px; }
.event-item.active .event-date { color: #3070e0; }
.event-item.summary-item.active .event-date { color: rgba(255,255,255,0.6); }
.event-title { margin-top: 2px; }
.main-panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: #fff; border-radius: 10px; padding: 18px; }
.card h2 { margin: 0 0 6px; font-size: 18px; }
.meta { color: #666; font-size: 13px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
th { background: #fafafa; font-weight: 600; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.4px; }
tfoot td { font-weight: 700; border-top: 2px solid #ddd; border-bottom: none; }
input[type="number"] { width: 80px; padding: 6px 8px; border: 1px solid #d0d0d5; border-radius: 5px; font-size: 14px; font-family: inherit; }
input[type="number"]:focus { outline: none; border-color: #3070e0; box-shadow: 0 0 0 3px rgba(48,112,224,0.15); }
.role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #eef4ff; color: #2050b0; font-size: 11px; font-weight: 500; }
.position-cell { color: #666; font-size: 12px; }
.overtime { color: #d03030; font-weight: 600; }
.empty { color: #999; padding: 32px; text-align: center; font-size: 14px; }
.hint { color: #888; font-size: 12px; margin-bottom: 12px; }
dialog { border: none; border-radius: 12px; padding: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.25); max-width: 90vw; }
dialog::backdrop { background: rgba(0,0,0,0.5); }
.dialog-body { padding: 22px; min-width: 460px; max-height: 80vh; overflow-y: auto; }
.dialog-body h3 { margin: 0 0 16px; font-size: 18px; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; }
.form-row input { flex: 1; padding: 7px 10px; border: 1px solid #d0d0d5; border-radius: 5px; font-family: inherit; font-size: 14px; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.employee-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #eee; font-size: 14px; }
.employee-row .emp-name { font-weight: 500; }
.employee-row .emp-pos { color: #666; font-size: 12px; }
.employee-row button { padding: 3px 8px; font-size: 12px; color: #d03030; border-color: #f0c0c0; }
.event-total-bar { margin-top: 14px; padding: 10px 14px; background: #f5f7ff; border-radius: 6px; font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
.event-total-bar strong { color: #2050b0; }
.status-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #666; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
.status-dot.online { background: #2ecc71; box-shadow: 0 0 0 3px rgba(46,204,113,0.2); }
.status-dot.offline { background: #e74c3c; }
.status-dot.local { background: #f39c12; }
.online-count { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; background: #eef4ff; color: #2050b0; border-radius: 12px; font-size: 12px; font-weight: 500; }
.banner { background: #fff3cd; color: #856404; padding: 10px 16px; border-radius: 6px; margin: 0 24px 8px; font-size: 13px; display: none; }
.banner.show { display: block; }
</style>

<dialog id="eventDialog">

    <div class="dialog-actions">
      <button onclick="document.getElementById('eventDialog').close()">Отмена</button>
      <button onclick="addEvent()" class="btn-primary">Сохранить</button>
    </div>
  </div>
</dialog>

<dialog id="shareDialog">

      <button onclick="document.getElementById('shareDialog').close()">Закрыть</button>

  </div>
</dialog>

function parseCompactEvents(text) {
  const lines = text.trim().split('\n');
  const result = [];
  let idx = 0;
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#')) continue;
    const parts = trimmed.split('|');
    if (parts.length < 2) continue;
    result.push({
      id: 'p_' + (idx++),
      date: parts[0],
      title: parts[1],
      location: parts[2] || '',
      producer: '', responsible: '', sound: '', light: '', video: '', direction: '', budgetCode: ''
    });
  }
  return result;
}

function formatMonth(m) {
  const [y, mo] = m.split('-');
  const n = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return n[parseInt(mo)-1] + ' ' + y;
}
function formatDate(d) { const [y,m,day] = d.split('-'); return day+'.'+m+'.'+y; }
function getMonths() { return [...new Set(state.events.map(e => e.date.slice(0,7)))].sort(); }
function getMonthEvents() { return state.events.filter(e => e.date.startsWith(currentMonth)).sort((a,b) => a.date.localeCompare(b.date) || a.title.localeCompare(b.title)); }
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function round1(n) { return Math.round(n*10)/10; }
function uid(prefix) { return (prefix||'id') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6); }

async function initData() {
  if (!isOnline) {
    try {
      const raw = localStorage.getItem('overtime_local_v4');
      if (raw) { state = JSON.parse(raw); return; }
    } catch(e) {}
    state = {
      employees: defaultEmployees.map(x => ({...x})),
      events: [...mayEvents.map(x => ({...x})), ...parseCompactEvents(compactEventsText)],
      hours: {}
    };
    saveLocal();
    return;
  }
  const metaSnap = await db.ref('meta/initialized').once('value');
  if (!metaSnap.val()) {
    const emps = {}; defaultEmployees.forEach(e => emps[e.id] = e);
    const evs = {};
    [...mayEvents, ...parseCompactEvents(compactEventsText)].forEach(e => evs[e.id] = e);
    await db.ref('employees').set(emps);
    await db.ref('events').set(evs);
    await db.ref('meta/initialized').set(true);
  }
}

function saveLocal() {
  try { localStorage.setItem('overtime_local_v4', JSON.stringify(state)); } catch(e) {}
}

function subscribeFirebase() {
  db.ref('employees').on('value', snap => {
    const val = snap.val() || {};
    state.employees = Object.values(val);
    if (!suppressRender) render();
  });
  db.ref('events').on('value', snap => {
    const val = snap.val() || {};
    state.events = Object.values(val);
    if (!suppressRender) render();
  });
  db.ref('hours').on('value', snap => {
    state.hours = snap.val() || {};
    updateHoursInPlace();
    updateSummary();
  });
  const uidKey = localStorage.getItem('presence_uid') || uid('u');
  localStorage.setItem('presence_uid', uidKey);
  const pRef = db.ref('presence/' + uidKey);
  pRef.onDisconnect().remove();
  pRef.set({ ts: Date.now() });
  setInterval(() => pRef.set({ ts: Date.now() }), 30000);
  db.ref('presence').on('value', snap => {
    const list = Object.values(snap.val() || {}).filter(p => Date.now() - p.ts < 120000);
    document.getElementById('onlineCount').style.display = list.length ? 'inline-flex' : 'none';
    document.getElementById('onlineNum').textContent = list.length;
  });
}

function setStatus(status, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + status;
  document.getElementById('statusText').textContent = text;
}

if (isOnline) {
  setStatus('online', 'Подключение…');
  db.ref('.info/connected').on('value', snap => {
    if (snap.val() === true) setStatus('online', 'Подключено');
    else setStatus('offline', 'Нет соединения');
  });
} else {
  setStatus('local', 'Локальный режим');
}

function render() {
  const months = getMonths();
  if (!months.length) {
    document.getElementById('monthTabs').innerHTML = '';
    document.getElementById('eventList').innerHTML = '';
    document.getElementById('mainPanel').innerHTML = '<div class="card"><div class="empty">Нет данных. Добавьте мероприятие.</div></div>';
    return;
  }
  if (!currentMonth || !months.includes(currentMonth)) {
    const today = new Date().toISOString().slice(0,7);
    currentMonth = months.includes(today) ? today : months[0];
  }
  const el = document.getElementById('monthTabs');
  el.innerHTML = months.map(m => '<button class="month-tab ' + (m===currentMonth?'active':'') + '" data-month="' + m + '">' + formatMonth(m) + '</button>').join('');
  el.querySelectorAll('.month-tab').forEach(b => b.onclick = () => { currentMonth = b.dataset.month; currentEventId = null; render(); });
  renderEventList();
  renderMainPanel();
}

function renderEventList() {
  const events = getMonthEvents();
  const el = document.getElementById('eventList');
  let html = '<div class="event-item summary-item ' + (currentEventId===null?'active':'') + '" data-id="__summary__">' +
    '<div class="event-date">Сводка</div><div class="event-title">📊 Итого за ' + formatMonth(currentMonth) + '</div></div>';
  if (!events.length) html += '<div class="empty">В этом месяце нет мероприятий</div>';
  else html += events.map(ev => '<div class="event-item ' + (ev.id===currentEventId?'active':'') + '" data-id="' + ev.id + '">' +
    '<div class="event-date">' + formatDate(ev.date) + '</div>' +
    '<div class="event-title">' + escapeHtml(ev.title) + '</div></div>').join('');
  el.innerHTML = html;
  el.querySelectorAll('.event-item').forEach(item => item.onclick = () => {
    currentEventId = item.dataset.id === '__summary__' ? null : item.dataset.id;
    renderEventList(); renderMainPanel();
  });
}

function getRoleFor(ev, empSurname) {
  const fields = [['responsible','Ответственный'],['sound','Звук'],['light','Свет'],['video','Видео'],['direction','Проведение']];
  for (const [f, label] of fields) if (ev[f] && ev[f].includes(empSurname)) return label;
  return '';
}

function renderMainPanel() {
  const el = document.getElementById('mainPanel');
  let html = '';
  if (currentEventId) {
    const ev = state.events.find(e => e.id === currentEventId);
    if (ev) html += renderEventCard(ev);
  }
  html += renderMonthlySummary();
  el.innerHTML = html;
  bindEventInputs();
}

function renderEventCard(ev) {
  const hours = state.hours[ev.id] || {};
  const meta = [];
  if (ev.location) meta.push('📍 ' + escapeHtml(ev.location));
  if (ev.producer) meta.push('🎬 ' + escapeHtml(ev.producer));
  if (ev.budgetCode) meta.push('💰 ' + escapeHtml(ev.budgetCode));
  const rows = state.employees.map(emp => {
    const role = getRoleFor(ev, emp.surname || emp.name.split(' ')[0]);
    const h = hours[emp.id] || '';
    return '<tr><td>' + escapeHtml(emp.name) + '</td>' +
      '<td class="position-cell">' + escapeHtml(emp.position || '') + '</td>' +
      '<td>' + (role ? '<span class="role-badge">' + role + '</span>' : '—') + '</td>' +
      '<td><input type="number" min="0" step="0.5" value="' + h + '" data-emp="' + emp.id + '" data-ev="' + ev.id + '" placeholder="0"></td></tr>';
  }).join('');
  return '<div class="card"><div class="toolbar" style="margin-bottom:8px;"><h2>' + escapeHtml(ev.title) + '</h2>' +
    '<div><button onclick="openEventDialog(\'' + ev.id + '\')">✎ Редактировать</button> <button onclick="deleteEvent(\'' + ev.id + '\')">🗑</button></div></div>' +
    '<div class="meta"><span>📅 ' + formatDate(ev.date) + '</span>' + meta.map(m => '<span>' + m + '</span>').join('') + '</div>' +
    '<table><thead><tr><th>Сотрудник</th><th>Должность</th><th>Роль</th><th>Часы</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="event-total-bar">Итого за мероприятие: <strong id="eventTotal">' + calcEventTotal(ev.id) + ' ч</strong></div></div>';
}
function calcEventTotal(evId) { const h = state.hours[evId] || {}; return round1(Object.values(h).reduce((s,v) => s + (Number(v)||0), 0)); }

function bindEventInputs() {
  document.querySelectorAll('input[data-emp]').forEach(inp => {
    inp.oninput = () => {
      const evId = inp.dataset.ev, empId = inp.dataset.emp, val = parseFloat(inp.value);
      if (!state.hours[evId]) state.hours[evId] = {};
      if (val && val > 0) state.hours[evId][empId] = val; else delete state.hours[evId][empId];
      if (isOnline) {
        db.ref('hours/' + evId + '/' + empId).set(val && val > 0 ? val : null);
      } else {
        saveLocal();
        const tot = document.getElementById('eventTotal');
        if (tot) tot.textContent = calcEventTotal(evId) + ' ч';
        updateSummary();
      }
    };
  });
}

function updateHoursInPlace() {
  document.querySelectorAll('input[data-emp]').forEach(inp => {
    if (document.activeElement === inp) return;
    const evId = inp.dataset.ev, empId = inp.dataset.emp;
    const val = state.hours[evId]?.[empId] || '';
    if (String(inp.value) !== String(val)) inp.value = val;
  });
  const tot = document.getElementById('eventTotal');
  if (tot && currentEventId) tot.textContent = calcEventTotal(currentEventId) + ' ч';
}

function renderMonthlySummary() {
  const events = getMonthEvents();
  const dates = [...new Set(events.map(e => e.date))].sort();
  const rows = state.employees.map(emp => {
    let totalHours = 0, overtime = 0, workDays = 0;
    for (const date of dates) {
      let dayTotal = 0;
      for (const ev of events) if (ev.date === date) dayTotal += (Number(state.hours[ev.id]?.[emp.id]) || 0);
      if (dayTotal > 0) workDays++;
      totalHours += dayTotal;
      if (dayTotal > 8) overtime += dayTotal - 8;
    }
    return { name: emp.name, position: emp.position || '', totalHours: round1(totalHours), workDays, overtime: round1(overtime) };
  });
  const totalAll = round1(rows.reduce((s,r) => s + r.totalHours, 0));
  const totalOt = round1(rows.reduce((s,r) => s + r.overtime, 0));
  return '<div class="card" id="summary"><h2>Итого за ' + formatMonth(currentMonth) + '</h2>' +
    '<p class="hint">Норма — 8 часов в день. Переработка = часы сверх 8 за день (суммируются все мероприятия дня).</p>' +
    '<table><thead><tr><th>Сотрудник</th><th>Должность</th><th>Рабочих дней</th><th>Всего часов</th><th>Переработка</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + escapeHtml(r.name) + '</td><td class="position-cell">' + escapeHtml(r.position) + '</td>' +
      '<td>' + (r.workDays||'—') + '</td><td>' + (r.totalHours||'—') + '</td>' +
      '<td class="' + (r.overtime>0?'overtime':'') + '">' + (r.overtime>0?r.overtime:'—') + '</td></tr>').join('') +
    '</tbody><tfoot><tr><td>Итого</td><td></td><td></td><td>' + totalAll + '</td><td class="' + (totalOt>0?'overtime':'') + '">' + (totalOt||'—') + '</td></tr></tfoot></table></div>';
}

function updateSummary() {
  const old = document.getElementById('summary');
  if (!old) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderMonthlySummary();
  old.replaceWith(tmp.firstElementChild);
}

function openEmployeeSettings() { renderEmployeeDialog(); document.getElementById('employeeDialog').showModal(); }
function renderEmployeeDialog() {
  const el = document.getElementById('employeeList');
  if (!state.employees.length) { el.innerHTML = '<div class="empty">Нет сотрудников</div>'; return; }
  el.innerHTML = state.employees.map(emp => '<div class="employee-row">' +
    '<span class="emp-name">' + escapeHtml(emp.name) + '</span>' +
    '<span class="emp-pos">' + escapeHtml(emp.position || '—') + '</span>' +
    '<button onclick="deleteEmployee(\'' + emp.id + '\')">Удалить</button></div>').join('');
}
function addEmployee() {
  const nameInp = document.getElementById('newEmployeeName');
  const posInp = document.getElementById('newEmployeePosition');
  const name = nameInp.value.trim(); if (!name) return;
  const emp = { id: uid('emp'), name, surname: name.split(' ')[0], position: posInp.value.trim() };
  if (isOnline) db.ref('employees/' + emp.id).set(emp);
  else { state.employees.push(emp); saveLocal(); renderEmployeeDialog(); renderMainPanel(); }
  nameInp.value = ''; posInp.value = '';
}
function deleteEmployee(id) {
  if (!confirm('Удалить сотрудника?')) return;
  if (isOnline) db.ref('employees/' + id).remove();
  else { state.employees = state.employees.filter(e => e.id !== id); saveLocal(); renderEmployeeDialog(); renderMainPanel(); }
}

function openEventDialog(editId) {
  const dlg = document.getElementById('eventDialog');
  const h3 = dlg.querySelector('h3');
  if (editId) {
    const ev = state.events.find(e => e.id === editId); if (!ev) return;
    h3.textContent = 'Редактировать мероприятие'; dlg.dataset.editId = editId;
    document.getElementById('newEventDate').value = ev.date;
    document.getElementById('newEventTitle').value = ev.title;
    document.getElementById('newEventLocation').value = ev.location||'';
    document.getElementById('newEventProducer').value = ev.producer||'';
    document.getElementById('newEventResponsible').value = ev.responsible||'';
    document.getElementById('newEventSound').value = ev.sound||'';
    document.getElementById('newEventLight').value = ev.light||'';
    document.getElementById('newEventVideo').value = ev.video||'';
    document.getElementById('newEventDirection').value = ev.direction||'';
    document.getElementById('newEventBudget').value = ev.budgetCode||'';
  } else {
    h3.textContent = 'Добавить мероприятие'; delete dlg.dataset.editId;
    ['newEventDate','newEventTitle','newEventLocation','newEventProducer','newEventResponsible','newEventSound','newEventLight','newEventVideo','newEventDirection','newEventBudget'].forEach(id => document.getElementById(id).value = '');
  }
  dlg.showModal();
}
function addEvent() {
  const dlg = document.getElementById('eventDialog');
  const date = document.getElementById('newEventDate').value;
  const title = document.getElementById('newEventTitle').value.trim();
  if (!date || !title) { alert('Укажите дату и название'); return; }
  const data = {
    date, title,
    location: document.getElementById('newEventLocation').value.trim(),
    producer: document.getElementById('newEventProducer').value.trim(),
    responsible: document.getElementById('newEventResponsible').value.trim(),
    sound: document.getElementById('newEventSound').value.trim(),
    light: document.getElementById('newEventLight').value.trim(),
    video: document.getElementById('newEventVideo').value.trim(),
    direction: document.getElementById('newEventDirection').value.trim(),
    budgetCode: document.getElementById('newEventBudget').value.trim(),
  };
  if (dlg.dataset.editId) {
    const id = dlg.dataset.editId;
    const ev = state.events.find(e => e.id === id);
    if (ev) Object.assign(ev, data);
    if (isOnline) db.ref('events/' + id).set({ ...ev, ...data });
    else { saveLocal(); render(); }
  } else {
    const id = uid('ev');
    const ev = { id, ...data };
    if (isOnline) db.ref('events/' + id).set(ev);
    else { state.events.push(ev); saveLocal(); }
    currentMonth = date.slice(0,7); currentEventId = null;
    if (!isOnline) render();
  }
  dlg.close();
}
function deleteEvent(id) {
  if (!confirm('Удалить мероприятие и все введённые часы?')) return;
  if (isOnline) { db.ref('events/' + id).remove(); db.ref('hours/' + id).remove(); }
  else { state.events = state.events.filter(e => e.id !== id); delete state.hours[id]; saveLocal(); render(); }
  if (currentEventId === id) currentEventId = null;
}

function exportCSV() {
  const events = getMonthEvents();
  const dates = [...new Set(events.map(e => e.date))].sort();
  const lines = ['Сотрудник;Должность;Рабочих дней;Всего часов;Переработка'];
  for (const emp of state.employees) {
    let total = 0, ot = 0, days = 0;
    for (const date of dates) {
      let d = 0; for (const ev of events) if (ev.date === date) d += (Number(state.hours[ev.id]?.[emp.id])||0);
      if (d > 0) days++; total += d; if (d > 8) ot += d - 8;
    }
    if (total > 0) lines.push([emp.name, emp.position||'', days, round1(total), round1(ot)].join(';'));
  }
  download('\uFEFF' + lines.join('\n'), 'pererabotki_' + currentMonth + '.csv', 'text/csv;charset=utf-8');
}
function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function showShareInfo() {
  document.getElementById('shareUrl').value = window.location.href;
  document.getElementById('shareDialog').showModal();
}
function copyShareUrl() {
  const inp = document.getElementById('shareUrl');
  inp.select(); document.execCommand('copy');
  alert('Ссылка скопирована!');
}

(async function start() {
  await initData();
  if (isOnline) subscribeFirebase();
  render();
})();
</script>
</body>
